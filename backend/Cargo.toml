[package]
name = "delibot-api"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
argon2 = { version = "0.5", features = ["std"] }
axum = { version = "0.8", features = ["json", "multipart"] }
axum-extra = { version = "0.12", features = ["cookie"] }
base64 = "0.22"
dotenvy = "0.15"
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1-rustls-tls"] }
rand = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { package = "sqlx-core", version = "0.9", default-features = false, features = ["migrate", "_rt-tokio", "_tls-rustls-ring-webpki"] }
sqlx-postgres = { version = "0.9", default-features = false, features = ["migrate", "uuid", "time"] }
time = { version = "0.3", features = ["serde", "formatting"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "fs"] }
tower-http = { version = "0.6", features = ["catch-panic", "compression-gzip", "limit", "request-id", "trace", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
uuid = { version = "1", features = ["serde", "v4"] }

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
