services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://127.0.0.1:8080
      API_BIND: 0.0.0.0:8080
      APP_URL: ${APP_URL:-http://localhost:3000}
      DATABASE_URL: postgresql://delibot:${POSTGRES_PASSWORD}@db:5432/delibot
      GMAIL_USER: ${GMAIL_USER:-}
      GMAIL_APP_PASSWORD: ${GMAIL_APP_PASSWORD:-}
      RECRUIT_EMAIL_TO: ${RECRUIT_EMAIL_TO:-}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      UPLOAD_DIR: /data/uploads
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      RUST_LOG: ${RUST_LOG:-delibot_api=info,tower_http=info}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads_data:/data/uploads
    ports:
      - "3000"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:3000 >/dev/null && curl --fail --silent http://127.0.0.1:8080/api/v1/health >/dev/null"]
      interval: 20s
      timeout: 5s
      retries: 5

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: delibot
      POSTGRES_USER: delibot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U delibot -d delibot"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  uploads_data:
