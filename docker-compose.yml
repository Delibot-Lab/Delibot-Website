services:
  secret-init:
    image: alpine:3.22
    restart: "no"
    command:
      - /bin/sh
      - -ec
      - |
        umask 077
        if [ ! -s /secrets/postgres_password ]; then
          od -An -N32 -tx1 /dev/urandom | tr -d ' \n' > /secrets/postgres_password
        fi
        chmod 0444 /secrets/postgres_password
    volumes:
      - db_secrets:/secrets

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    restart: unless-stopped
    environment:
      HOSTNAME: 0.0.0.0
      API_INTERNAL_URL: http://127.0.0.1:8080
      API_BIND: 0.0.0.0:8080
      APP_URL: ${APP_URL:-https://delibot-lab.server.cbgpu.com}
      GMAIL_USER: ${GMAIL_USER:-}
      GMAIL_APP_PASSWORD: ${GMAIL_APP_PASSWORD:-}
      RECRUIT_EMAIL_TO: ${RECRUIT_EMAIL_TO:-}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      UPLOAD_DIR: /data/uploads
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      RUST_LOG: ${RUST_LOG:-delibot_api=info,tower_http=info}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads_data:/data/uploads
      - db_secrets:/run/secrets:ro
    ports:
      - "3000"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:3000 >/dev/null && curl --fail --silent http://127.0.0.1:8080/api/v1/health >/dev/null"]
      interval: 20s
      timeout: 5s
      retries: 5

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: delibot
      POSTGRES_USER: delibot
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    depends_on:
      secret-init:
        condition: service_completed_successfully
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - db_secrets:/run/secrets:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U delibot -d delibot"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  uploads_data:
  db_secrets:
